# krtr login theme (task 3.3 of docs/guia-web-seguridad_modal.md).
# Extends Keycloak's unstyled `base` theme: template.ftl and login.ftl lay the page out like the
# login screen of docs/krtr diseño.html, and css/krtr.css carries its colors and typography.
# The kc*Class properties map the markup of base's other pages (OTP, required actions, errors)
# onto the same classes, so they look alike without overriding each template.
parent=base
locales=es,pt-BR

styles=css/krtr.css

kcFormClass=krtr-form
kcFormGroupClass=krtr-field
kcLabelWrapperClass=krtr-label-wrapper
kcLabelClass=krtr-label
kcInputWrapperClass=krtr-input-wrapper
kcInputClass=krtr-input
kcTextareaClass=krtr-input
kcInputGroup=krtr-input-group
kcInputErrorMessageClass=krtr-field-error
kcFormOptionsClass=krtr-form-options
kcFormOptionsWrapperClass=krtr-form-options
kcFormSettingClass=krtr-form-options
kcFormButtonsClass=krtr-form-buttons
kcFormButtonsWrapperClass=krtr-form-buttons
kcButtonClass=krtr-btn
kcButtonPrimaryClass=krtr-btn-primary
kcButtonDefaultClass=krtr-btn-secondary
kcButtonBlockClass=krtr-btn-block
kcButtonLargeClass=
kcFormPasswordVisibilityButtonClass=krtr-hidden
kcSelectAuthListClass=krtr-auth-list
kcSelectAuthListItemClass=krtr-auth-item
kcLoginOTPListClass=krtr-otp-list
kcLoginOTPListInputClass=krtr-otp-radio
