[project]
name = "krtr"
version = "1.9.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "boto3>=1.43.103",
    "dotenv>=0.9.9",
    "flake8>=7.4.1",
    "isort>=9.0.1",
    "polars>=1.44.2",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "notebook>=7.6.3",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "tqdm>=4.70.1",
    "typer>=0.27.2",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "authlib>=1.8.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "cryptography>=50.0.2",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "joserfc>=1.7.5",
]

[tool.black]
line-length = 100
extend-exclude = '''
/(
  krtr/front
)/
'''

[tool.ruff]
line-length = 100
extend-exclude = ["krtr/front"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["krtr/front", "node_modules", "dist", ".venv"]

[project.scripts]
krtr = "krtr.cli.main:app"

[project.optional-dependencies]
modal = [
    "modal>=1.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["krtr"]
exclude = ["krtr/front", "**/node_modules", "**/dist"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock --upgrade-package krtr && git add uv.lock"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = false
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "master"

[tool.semantic_release.changelog.default_templates]
mask_initial_release = false
