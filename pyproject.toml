[project]
name = "krtr"
version = "1.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "boto3>=1.43.103",
    "dotenv>=0.9.9",
    "flake8>=7.4.1",
    "isort>=9.0.1",
    "notebook>=7.6.3",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "typer>=0.27.2",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
krtr = "krtr.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["krtr"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock --upgrade-package krtr && git add uv.lock"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = false
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "master"

[tool.semantic_release.changelog.default_templates]
mask_initial_release = false
