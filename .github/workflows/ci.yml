name: CI

on:
  push:
    branches: [master]
    paths:
      - "krtr/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "krtr/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting (black)
        run: uv run black --check krtr tests

      - name: Lint (flake8)
        run: uv run flake8 krtr tests

      - name: Lint (ruff)
        run: uv run ruff check krtr tests

      - name: Run tests (pytest)
        run: uv run pytest tests
